<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoreHouse — Support</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --rule: #d2d2d7; --band: #f5f5f7; --page: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #a1a1a6; --rule: #38383a; --band: #1c1c1e; --page: #000000; } }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; margin: 0; color: var(--text); background: var(--page); }
    header { padding: 2rem 1.25rem; background: var(--band); }
    header > div, main { max-width: 760px; margin: 0 auto; }
    main { padding: 1.25rem; }
    h1 { margin: 0 0 .25rem; font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.2; }
    ul { padding-left: 1.25rem; }
    li { margin: .35rem 0; }
    a { color: inherit; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>StoreHouse</h1>
      <p class="muted">Bible reading plans, and a record of what you’ve read.</p>
    </div>
  </header>
  <main>
    <p>Questions, problems or ideas? Email <a href="mailto:daragh.dev@icloud.com">daragh.dev@icloud.com</a>.</p>
    <ul>
      <li><a href="privacy/">Privacy Policy</a></li>
      <li><a href="terms/">Terms of Use</a></li>
    </ul>
  </main>
</body>
</html>
